type: object
properties:
  _id:
    type: string
    format: objectId
    description: Unique identifier of the contact
  name:
    type: string
    description: Name of the contact
    example: Іван Петренко
  phoneNumber:
    type: string
    description: Phone number of the contact
    example: "+380991234567"
  email:
    type: string
    format: email
    description: Email address of the contact
    example: ivan@example.com
  isFavourite:
    type: boolean
    description: Whether the contact is marked as favorite
    default: false
  contactType:
    type: string
    enum: [work, home, personal]
    description: Type of the contact
    default: personal
  userId:
    type: string
    format: objectId
    description: User ID that owns this contact
  photo:
    type: string
    description: URL of the contact's photo
  createdAt:
    type: string
    format: date-time
    description: Date and time when the contact was created
  updatedAt:
    type: string
    format: date-time
    description: Date and time when the contact was last updated
required:
  - name
  - phoneNumber
  - contactType
  - userId