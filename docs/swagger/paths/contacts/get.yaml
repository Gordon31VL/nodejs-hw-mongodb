tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieves all contacts with support for pagination, sorting, and filtering
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number for pagination
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: perPage
    in: query
    description: Number of contacts per page
    required: false
    schema:
      type: integer
      minimum: 1
      default: 10
  
  - name: sortBy
    in: query
    description: Field to sort by
    required: false
    schema:
      type: string
      enum: [name, phoneNumber, email, createdAt, updatedAt, _id]
      default: _id
  - name: sortOrder
    in: query
    description: Sort order (ascending or descending)
    required: false
    schema:
      type: string
      enum: [asc, desc]
      default: asc
  
  - name: name
    in: query
    description: Filter contacts by name (partial match)
    required: false
    schema:
      type: string
  - name: phoneNumber
    in: query
    description: Filter contacts by phone number (partial match)
    required: false
    schema:
      type: string
  - name: email
    in: query
    description: Filter contacts by email (partial match)
    required: false
    schema:
      type: string
  - name: isFavourite
    in: query
    description: Filter contacts by favorite status
    required: false
    schema:
      type: boolean
  - name: contactType
    in: query
    description: Filter contacts by type
    required: false
    schema:
      type: string
      enum: [work, home, personal]

responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: array
              items:
                $ref: ../../components/schemas/contact.yaml
  '401':
    description: Not authorized
    content:
      application/json:
        schema:
          $ref: ../../components/responses/errorResponses.yaml#/Unauthorized