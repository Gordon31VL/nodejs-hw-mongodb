tags:
  - Contacts
summary: Delete contact by ID
operationId: deleteContactById
description: Removes a specific contact by its ID
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: ID of the contact to delete
    schema:
      type: string
      format: objectId
responses:
  '204':
    description: Contact successfully deleted (No Content)
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: ../../../components/responses/errorResponses.yaml#/NotFound
  '401':
    description: Not authorized
    content:
      application/json:
        schema:
          $ref: ../../../components/responses/errorResponses.yaml#/Unauthorized