tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Retrieves detailed information about a specific contact by its ID
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: ID of the contact to retrieve
    schema:
      type: string
      format: objectId
responses:
  '200':
    description: Successfully found contact with id ${contactId}!
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id ${contactId}!
            data:
              type: array
              items:
                $ref: ../../../components/schemas/contact.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: ../../../components/responses/errorResponses.yaml#/NotFound